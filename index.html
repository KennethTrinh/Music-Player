<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ken's Website</title>
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <link
      rel="icon"
      href="https://i.pinimg.com/236x/c5/f3/04/c5f30496e61ff54940f9f4865e1d53fd.jpg"
    />
    <!-- <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet"> -->
    <!-- <script src="https://kit.fontawesome.com/111924c1a3.js" crossorigin="anonymous"></script> -->
  </head>
  <body>
    <div class="app">
      <aside class="playlist-container">
        <div class="playlist-text">
          <strong> My Hopeless Romantic Playlist </strong>
          <span class="playlist-toggle-arrow">&#9660;</span>
        </div>
        <div class="playlist"></div>
        <label class="add-songs">
          <input type="file" accept=".mp3,audio/*" onchange="extract(this)" multiple />
        </label>
      </aside>

      <main class="music-player">
        <div id="no-worklet" style="display: none">
          Audio Worklet API not supported by you browser, try a recent Chrome version.
        </div>

        <section class="now-playing">
          <div class="np-art-wrap">
            <img id="np-art" alt="Album art" hidden />
            <span class="np-art-placeholder">&#9835;</span>
          </div>
          <div class="np-meta">
            <span class="np-label">Now playing</span>
            <h1>Pitch shifter</h1>
            <div class="sound-wave"></div>
          </div>
        </section>

        <canvas id="canvas"></canvas>

        <section class="controls">
          <div class="controls-row selects-row">
            <label for="algorithm-select">
              <span>Pitch algorithm</span>
              <select id="algorithm-select">
                <option value="pghi">Phase gradient (PGHI)</option>
                <option value="classic">Classic (peak shifting)</option>
              </select>
            </label>
            <label for="frequency-select">
              <span>EQ band</span>
              <select id="frequency-select">
                <option value="40">Sub-bass (20 Hz - 60 Hz)</option>
                <option value="155">Bass (60 Hz - 250 Hz)</option>
                <option value="375">Low Midrange (250 Hz - 500 Hz)</option>
                <option value="1250">Midrange (500 Hz - 2000 Hz)</option>
                <option value="3000">Upper Midrange (2000 Hz - 4000 Hz)</option>
                <option value="5000">Presence (4000 Hz - 6000 Hz)</option>
                <option value="7000">Brilliance (6000 Hz - 8000 Hz)</option>
                <option value="10000">Air (8000 Hz - 12000 Hz)</option>
                <option value="16000">High frequencies (12000 Hz - 20000 Hz)</option>
              </select>
            </label>
          </div>
          <div class="controls-row">
            <label for="pitch">
              <span>Pitch (semitones)</span>
              <input id="pitch" type="range" min="-12" max="12" step="1" />
              <span id="pitch-value">0</span>
            </label>
          </div>
          <div class="controls-row">
            <label for="speed">
              <span>Speed (semitones)</span>
              <input id="speed" type="range" min="-12" max="12" step="1" />
              <span id="speed-value">0</span>
            </label>
            <label for="equalizer">
              <span>Equalizer gain</span>
              <input id="equalizer" type="range" min="-50" max="50" step="1" value="0" />
              <span id="equalizer-value">0</span>
            </label>
          </div>
        </section>
      </main>

      <footer class="transport">
        <audio id="audio-player"></audio>
        <div class="transport-buttons">
          <button id="prev-btn" type="button" aria-label="Previous song">&#9198;&#xFE0E;</button>
          <button id="play-btn" type="button" class="play" aria-label="Play">&#9654;&#xFE0E;</button>
          <button id="next-btn" type="button" aria-label="Next song">&#9197;&#xFE0E;</button>
        </div>
        <div class="transport-seek">
          <span id="time-current">0:00</span>
          <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" />
          <span id="time-total">0:00</span>
        </div>
        <div class="transport-volume">
          <span aria-hidden="true">&#128266;&#xFE0E;</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
        </div>
      </footer>
    </div>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script type="module">
      // Import and expose parseBlob globally for use in bundle.js
      import { parseBlob } from "https://cdn.jsdelivr.net/npm/music-metadata@11.12.3/+esm";
      window.parseBlob = parseBlob;
    </script>
    <script src="./dist/bundle.js"></script>
  </body>
</html>
